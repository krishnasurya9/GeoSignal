[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "geosignal"
version     = "0.1.0"
description = "Geopolitical Event → Economic Impact Analysis Pipeline"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = [".", "src"]
addopts      = "-q"
